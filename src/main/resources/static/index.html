<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expenses</title>
    <link href="stylesheet.css" rel="stylesheet" />
</head>
<body>

<h1>Hello User</h1>
<form>
    <label for="username">Enter UserName</label>
    <input type="text" name="username" id="username" />
    <label for="password">Enter Password</label>
    <input type="text" name="password" id="password" />
    <button type="button" onclick="SignupUser()">SignUp</button>
</form>
<a href="http://localhost:8080/logout">Logout</a>

<form>
    <input type="date" name="Startdate" id="Startdate" />
    <input type="date" name="Enddate" id="Enddate" />
    <button type="button" onclick="FetchFilteredExpenses()">Filter by Date</button>
</form>
<table border="1" id="expenseTable">
    <thead>
    <tr>
        <th>Category</th>
        <th>Amount</th>
        <th>Date</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>
<form id="expenseForm">
    <input type="text" id="title" placeholder="Title" required>
    <input type="number" id="amount" placeholder="Amount" required>
    <input type="date" id="date" required>
    <button type="button" onclick="submitExpense()">Add Expense</button>
</form>

<form id="CalculateForUsersSalary">
    <label for="salary">Calculate Salary</label>
    <input type="text" id="salary" placeholder="Title" required>
    <button type="button" onclick="SubtractFromSalary()">Calculate Your Current Salary</button>
</form>
<p id="remainingSalary"></p>

<h2>Habit Tracker</h2>

<div id="habitTracker" class="habit-grid"></div>

<form id="file-upload">
    <input type="file" id="file" />
    <button type="button" onclick="uploadFile()">Upload</button>
</form>
<table id="usersTable" border="1">
    <thead>
    <tr>
        <th>Username</th>
        <th>Password</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="/js/expenses.js"></script>
</body>
</html>
